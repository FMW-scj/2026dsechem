        function createSidebarButtons() {
            const navTabs = document.getElementById('nav-tabs');
            navTabs.innerHTML = '';
            
            contentData.forEach((data, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn text-left px-4 py-3 hover:bg-slate-50 border-l-4 border-transparent text-slate-600 transition-colors duration-200 focus:outline-none flex justify-between items-center ${index === 0 ? 'tab-active' : ''}`;
                btn.onclick = () => changeTab(index);
                
                btn.innerHTML = `
                    <span class="flex items-center overflow-hidden whitespace-nowrap text-ellipsis mr-2">
                        <i class="fas ${data.icon} w-5 text-center mr-2 flex-shrink-0"></i>
                        <span class="truncate">${data.tab || data.title}</span>
                    </span>
                    <i class="fas fa-chevron-right text-[10px] text-slate-400 flex-shrink-0"></i>
                `;
                navTabs.appendChild(btn);
            });
        }

        function changeTab(index) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, i) => {
                if(i === index) {
                    tab.classList.add('tab-active');
                    tab.classList.replace('text-slate-600', 'text-purple-700');
                } else {
                    tab.classList.remove('tab-active');
                    tab.classList.replace('text-purple-700', 'text-slate-600');
                }
            });

            const data = contentData[index];
            const contentArea = document.getElementById('content-area');
            
            const contentHTML = `
                <div class="fade-in">
                    <div class="flex items-center space-x-3 mb-4">
                        <i class="fas ${data.icon} text-3xl"></i>
                        <h2 class="text-3xl font-black text-slate-800">${data.title}</h2>
                    </div>
                    <p class="text-lg text-slate-500 font-medium pb-4 border-b border-slate-200">${data.intro}</p>
                    <div class="mt-4">
                        ${data.body}
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = contentHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            createSidebarButtons();
            changeTab(0);
        });
    </script>
