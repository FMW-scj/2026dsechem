                            <h3 class="text-slate-800 font-black text-xl mb-4 border-b pb-2">Process Comparison (The 5** Essay Trap)</h3>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">

                                <div class="bg-slate-50 p-5 rounded-xl border-t-4 border-slate-400 shadow-sm">
                                    <h4 class="font-bold text-slate-800 text-lg mb-3">Monsanto Process (Old)</h4>
                                    <ul class="text-sm text-slate-700 space-y-3">
                                        <li><strong class="text-slate-900">Catalyst:</strong> Rhodium/Iodine (Rh/I) complex</li>

                                        <li><strong class="text-rose-600 block mb-1 mt-2">Disadvantages:</strong> Rhodium is a very rare and expensive precious metal.<br><br>It requires a <strong>high concentration of water</strong> in the reactor to keep the catalyst stable. This requires <strong>massive amounts of energy</strong> to remove the water later via distillation, and promotes unwanted side reactions (like the water-gas shift reaction).</li>
                                    </ul>
                                </div>
                                
                                <!-- CATIVA -->
                                <div class="bg-emerald-50 p-5 rounded-xl border-t-4 border-emerald-500 shadow-sm">

                                    <ul class="text-sm text-slate-700 space-y-3">

                                        <li><strong class="text-emerald-700 block mb-1 mt-2">Advantages:</strong> Iridium is much cheaper than rhodium.<br><br>The catalyst is highly stable even at a <strong>very low water concentration</strong>. This drastically <strong>reduces the energy required for distillation/drying</strong>, increases the overall reaction rate, and produces fewer by-products!</li>

        // Function to handle tab switching
        function changeTab(index) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, i) => {
                if(i === index) {
                    tab.classList.add('tab-active');
                    tab.classList.replace('text-slate-600', 'text-slate-800');
                } else {
                    tab.classList.remove('tab-active');
                    tab.classList.replace('text-slate-800', 'text-slate-600');
                }
            });

            const data = contentData[index];
            const contentArea = document.getElementById('content-area');
            
            const contentHTML = `
                <div class="fade-in">
                    <div class="flex items-center space-x-3 mb-4">
                        <i class="fas ${data.icon} text-3xl"></i>
                        <h2 class="text-3xl font-black text-slate-800">${data.title}</h2>
                    </div>
                    <p class="text-lg text-slate-500 font-medium pb-6 border-b border-slate-200">${data.intro}</p>
                    <div class="mt-4">
                        ${data.body}
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = contentHTML;
        }

        // Initialize first tab on load
        document.addEventListener('DOMContentLoaded', () => {
            changeTab(0);
        });
