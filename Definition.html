<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE Chemistry Revision Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- MathJax for rendering chemistry formulas enclosed in $ -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .active-tab {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-12 px-4 shadow-lg text-center">
        <h1 class="text-4xl font-bold mb-2">HKDSE Chemistry</h1>
        <p class="text-blue-100 text-lg">Essential Definitions & Core Principles</p>
        
        <div class="mt-8 max-w-xl mx-auto flex gap-2 px-4">
            <div class="relative flex-grow">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search definitions (e.g. Enthalpy, Isomers...)" 
                       class="w-full pl-10 pr-4 py-2 rounded-lg text-slate-900 focus:ring-2 focus:ring-blue-300 outline-none">
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="sticky-nav bg-white border-b overflow-x-auto whitespace-nowrap px-4 shadow-sm">
        <div id="navContainer" class="max-w-6xl mx-auto flex space-x-6 py-4">
            <!-- Navigation items generated by JS -->
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 md:p-8">
        <div id="contentArea" class="space-y-12">
            <!-- Sections generated by JS -->
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-8 text-center border-t border-slate-700 mt-20">
        <p>HKDSE Chemistry Definitional Guide</p>
        <p class="text-sm mt-2">Use Formula syntax: $H^+(aq)$, $Cl^-$, $CH_4$</p>
    </footer>

    <script>
        const chemistryData = [
            {
                part: "I",
                title: "Planet Earth",
                items: [
                    { term: "saturated solution", def: "A saturated solution is a solution in which the solvent has dissolved the maximum amount of the solute it can at a particular temperature." },
                    { term: "Filtration principle", def: "There are many tiny holes in filter paper. These holes allow particles of water (i.e. solvent) and dissolved salts to pass through. Insoluble solids, like mud, remain on the filter paper as residue." },
                    { term: "Crystallization", def: "Hot water can dissolve more XXX than cold water. When hot saturated solution cools slowly to room temperature, it cannot hold all the dissolved XXX . Hence, crystals of XXX will be separated out." },
                    { term: "Function of anti-pumping granules", def: "They prevent bumping due to overheating of reaction mixture." }
                ]
            },
            {
                part: "II",
                title: "Microscopic World I",
                items: [
                    { term: "Isotopes", def: "Isotopes are atoms of the same element, with the same number of protons but different numbers of neutrons. (same chemical properties and slightly different physical properties)" },
                    { term: "Period number of an element", def: "= number of occupied electron shells in an atom of that element" },
                    { term: "Group number of an element", def: "= number of electrons in the outermost shell in an atom of that element" },
                    { term: "Octet rule", def: "Octet rule states that all atoms tend to attain the stable electronic arrangement of a noble gas (in most cases an ‘octet’." },
                    { term: "Metallic bond", def: "Metallic bond refers to the electrostatic attraction between delocalized electrons and metal ions ." },
                    { term: "Ionic bond", def: "Ionic bond refers to the electrostatic attraction between oppositely charged ions ." },
                    { term: "Covalent bond", def: "Covalent bond refers to the electrostatic attraction between the shared electrons and the two nuclei of the bonded atoms." },
                    { term: "Dative covalent bond", def: "A dative covalent bond is a covalent bond formed between two atoms where both electrons in the shared pair are contributed by the same atom." }
                ]
            },
            {
                part: "III",
                title: "Metal",
                items: [
                    { term: "Displacement reaction", def: "Displacement reaction is a reaction in which one element displaces another element from its compound" }
                ]
            },
            {
                part: "IV",
                title: "Acids and Bases",
                items: [
                    { term: "Acid", def: "An acid is a molecular compound, which forms hydrogen ions $H^+(aq)$ as the only cation when dissolved in water." },
                    { term: "Monobasic acid", def: "E.g. Each hydrogen chloride ($HCl$) molecule ionizes in water to give one hydrogen ion." },
                    { term: "Base", def: "A base is a compound which reacts with an acid forming salt and water only . (An alkali is a water-soluble base .)" },
                    { term: "Strong alkali", def: "A strong alkali is an alkali which dissociates completely in water." },
                    { term: "Weak alkali", def: "A weak alkali is an alkali which ionizes slightly in water." },
                    { term: "Standard solution", def: "A standard solution is a solution of accurately known concentration ." },
                    { term: "Primary standard", def: "A primary standard is a substance which can be used to prepare a standard solution directly." }
                ]
            },
            {
                part: "V",
                title: "Fossil Fuels and Carbon Compounds",
                items: [
                    { term: "Formation of petroleum and natural gas", def: "They formed from the remains of ancient marine organisms which were then buried under sedimentary rocks for a long time. High temperature and pressure slowly changed them into petroleum and natural gas." },
                    { term: "Aromatic", def: "Aromatic hydrocarbons are hydrocarbons with one or more benzene rings." },
                    { term: "homologous series", def: "A homologous series is a series of carbon compounds that have the same general formula and each member differs from the next by a –$CH_2$– unit." },
                    { term: "Substitution", def: "Substitution reaction is a reaction in which an atom (or a group of atoms) of a molecule is replaced by another atom (or group of atoms)." },
                    { term: "Cracking", def: "Cracking is the breaking down of large molecules into smaller ones." },
                    { term: "Addition", def: "Addition reaction is a reaction in which two or more molecules combine to give a single molecule." },
                    { term: "Polymerization", def: "Polymerization is the process of joining many small molecules together repeatedly to form very large molecules." }
                ]
            },
            {
                part: "VI",
                title: "Microscopic World II",
                items: [
                    { term: "Electronegativity", def: "The electronegativity of an atom refers to the power of the atom to attract electrons to itself in a bonding situation." }
                ]
            },
            {
                part: "VII",
                title: "Redox Reactions, Chemical Cells and Electrolysis",
                items: [
                    { term: "Primary cells", def: "Primary cells are not rechargeable." },
                    { term: "Secondary cells", def: "Secondary cells can be recharged." },
                    { term: "Salt bridge", def: "A salt bridge completes the circuit by providing ions to balance the charges in the two half cells." },
                    { term: "Porous device", def: "A porous device completes the circuit by allowing ions to move between two half cells." },
                    { term: "Disproportionation", def: "The reaction in which a species is simultaneously reduced and oxidized is called disproportionation." },
                    { term: "Electroplating", def: "Electroplating is a process that plates a thin layer of metal on an object by electrolysis." }
                ]
            },
            {
                part: "VIII",
                title: "Chemical Reactions and Energy",
                items: [
                    { term: "Standard enthalpy change of reaction", def: "Standard enthalpy change of reaction is the enthalpy change when the numbers of moles of reactants specified in the thermochemical equation react completely under standard conditions." },
                    { term: "Standard enthalpy change of combustion", def: "Standard enthalpy change of combustion of a substance is the enthalpy change when one mole of the substance burns completely in oxygen under standard conditions." },
                    { term: "Standard enthalpy change of neutralization", def: "Standard enthalpy change of neutralization is the enthalpy change when one mole of water is produced from the neutralization between an acid and an alkali under standard conditions." },
                    { term: "Standard enthalpy change of formation", def: "Standard enthalpy change of formation of a substance is the enthalpy change when one mole of the substance forms from its constituent elements in their standard states under standard conditions." },
                    { term: "Hess’s Law", def: "The total enthalpy change of a chemical reaction depends on the initial and final states of the reaction, but is independent of the route taken." }
                ]
            },
            {
                part: "IX",
                title: "Rate of Reaction",
                items: [
                    { term: "Initial rate", def: "The instantaneous rate of a reaction at time t = 0 (the starting time of the reaction) is called the initial rate." },
                    { term: "collision theory", def: "the reactant particles must have sufficient energy to react and collide in a proper orientation in order for a reaction to occur." }
                ]
            },
            {
                part: "X",
                title: "Chemical Equilibrium",
                items: [
                    { term: "Le Châtelier’s Principle", def: "Le Châtelier’s Principle states that when a chemical system at equilibrium is disturbed by a change in conditions, the equilibrium position will shift in a direction that tends to counteract the change." }
                ]
            },
            {
                part: "XI",
                title: "Chemistry of Carbon Compounds",
                items: [
                    { term: "Isomers", def: "Isomers are compounds that have the same molecular formula but different structures or different arrangements of atoms in space." },
                    { term: "Cis-trans isomers", def: "Cis-trans isomers are stereoisomers resulting from the restricted rotation about the carbon-carbon double bond." },
                    { term: "Enantiomers", def: "Enantiomers are stereoisomers that are mirror images of one another but are not superimposable." },
                    { term: "Markovnikov’s rule", def: "Markovnikov’s rule states that the hydrogen atom in $HX$ is added to the carbon atom of the carbon-carbon double bond that already has the greater number of hydrogen atoms." },
                    { term: "Hydrolysis", def: "Hydrolysis is a reaction in which a compound is broken down by reaction with water." },
                    { term: "Condensation polymerization", def: "Condensation polymerization is a reaction in which monomer molecules join together repeatedly to form polymer molecules with the elimination of small molecules(E.g. $H_2O$)." },
                    { term: "Nylon", def: "Nylon is a polyamide in which its monomers are joined by amide linkages (–CONH–)." },
                    { term: "Polyester", def: "Polyester is a condensation polymer in which its monomers are joined by ester linkages (–COO–)." }
                ]
            }
        ];

        function render() {
            const navContainer = document.getElementById('navContainer');
            const contentArea = document.getElementById('contentArea');
            navContainer.innerHTML = '';
            contentArea.innerHTML = '';

            chemistryData.forEach((section, idx) => {
                // Nav
                const navItem = document.createElement('a');
                navItem.href = `#section-${idx}`;
                navItem.className = "text-slate-600 font-semibold hover:text-blue-500 transition-colors py-1";
                navItem.innerText = section.title;
                navContainer.appendChild(navItem);

                // Section
                const sectionEl = document.createElement('section');
                sectionEl.id = `section-${idx}`;
                sectionEl.innerHTML = `
                    <div class="flex items-baseline gap-4 mb-6 border-b-2 border-blue-100 pb-2">
                        <span class="text-blue-500 font-bold text-xl uppercase tracking-widest">Part ${section.part}</span>
                        <h2 class="text-3xl font-bold text-slate-800">${section.title}</h2>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        ${section.items.map(item => `
                            <div class="glass-card p-6 rounded-xl">
                                <h3 class="text-blue-700 font-bold text-lg mb-2">${item.term}</h3>
                                <p class="definition-text text-slate-600 leading-relaxed">${item.def}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
                contentArea.appendChild(sectionEl);
            });

            // Re-render LaTeX math formulas after updating the DOM
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch((err) => console.log(err.message));
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });

            // Hide empty sections
            chemistryData.forEach((_, idx) => {
                const section = document.getElementById(`section-${idx}`);
                const visibleCards = section.querySelectorAll('.glass-card[style="display: block;"]').length || 
                                     section.querySelectorAll('.glass-card:not([style*="display: none"])').length;
                section.style.display = visibleCards === 0 ? 'none' : 'block';
            });
        });

        // Initialize
        render();
    </script>
</body>
</html>
