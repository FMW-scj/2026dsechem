                                    <span class="w-1/4 font-bold text-green-900">Chlorine (Cl<sub>2</sub>)</span>
                                    <div class="w-3/4">
                                        <p class="text-sm text-slate-700 font-medium">Test with <strong>moist blue/red litmus paper (濕潤石蕊試紙)</strong>.</p>
                                        <p class="text-sm text-emerald-600 font-bold mt-1">Observation: The paper turns red (if blue was used), and then is bleached white.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                title: "Golden Rules for Planet Earth",
                icon: "fa-star text-amber-500",
                intro: "Final checks before you submit your paper. Always keep these in mind! (交卷前必 Check!)",
                body: `
                    <div class="mt-8 space-y-6">
                        <div class="bg-gradient-to-r from-emerald-900 to-teal-800 p-6 rounded-xl text-white shadow-lg relative overflow-hidden">
                            <i class="fas fa-eye absolute -right-4 -bottom-4 text-7xl text-white opacity-10 transform -rotate-12"></i>
                            <h3 class="font-black text-2xl mb-2 flex items-center text-yellow-300">
                                <i class="fas fa-exclamation-triangle mr-3"></i> Observable Changes
                            </h3>
                            <p class="text-emerald-100 text-[1.05rem] leading-relaxed">
                                When a question asks for "observable changes" or "observations":<br><br>
                                ❌ Do NOT write "Carbon dioxide is formed" (Gas name is not an observation).<br>
                                ✅ DO write "Colourless gas bubbles evolve" or "Effervescence occurs".
                            </p>
                        </div>

                        <div class="bg-gradient-to-r from-slate-800 to-slate-700 p-6 rounded-xl text-white shadow-lg relative overflow-hidden">
                            <i class="fas fa-spell-check absolute -right-4 -bottom-4 text-7xl text-white opacity-10 transform rotate-12"></i>
                            <h3 class="font-black text-2xl mb-2 flex items-center text-blue-400">
                                <i class="fas fa-flask mr-3"></i> Splint Test Precision
                            </h3>
                            <p class="text-slate-200 text-[1.05rem] leading-relaxed">
                                Never mix up the splints! <br><br>
                                Use a <strong>glowing splint</strong> for Oxygen (it relights). <br>
                                Use a <strong>burning splint</strong> for Hydrogen (it gives a pop sound).
                            </p>
                        </div>
                        
                        <div class="text-center mt-8 text-slate-500 font-bold">
                            Good luck on your HKDSE Chemistry Exam! 🚀
                        </div>
                    </div>
                `
            }
        ];

        // Function to handle tab switching
        function changeTab(index) {
            // Update Tab Styling
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, i) => {
                if(i === index) {
                    tab.classList.add('tab-active');
                    tab.classList.replace('text-slate-600', 'text-emerald-700');
                } else {
                    tab.classList.remove('tab-active');
                    tab.classList.replace('text-emerald-700', 'text-slate-600');
                }
            });

            // Fetch Content
            const data = contentData[index];
            const contentArea = document.getElementById('content-area');
            
            // Generate HTML structure for content
            const contentHTML = `
                <div class="fade-in">
                    <div class="flex items-center space-x-3 mb-4">
                        <i class="fas ${data.icon} text-3xl"></i>
                        <h2 class="text-3xl font-black text-slate-800">${data.title}</h2>
                    </div>
                    <p class="text-lg text-slate-500 font-medium pb-6 border-b border-slate-200">${data.intro}</p>
                    <div class="mt-4">
                        ${data.body}
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = contentHTML;
        }

        // Initialize first tab on load
        document.addEventListener('DOMContentLoaded', () => {
            changeTab(0);
        });
    </script>
</body>
</html>
