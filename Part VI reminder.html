            {

                                    <li><strong class="text-purple-600">NH<sub>3</sub></strong>: Nitrogen has 5 outermost e⁻. It forms 3 bond pairs, leaving <strong>1 lone pair</strong>.<br>&rarr; Shape: <strong class="text-slate-800">Trigonal pyramidal</strong></li>
                                </ul>
                            </div>
                            
                            <div class="border border-slate-200 p-5 rounded-xl shadow-sm bg-white">

                                    <li><strong class="text-purple-600">SF<sub>2</sub></strong>: Sulphur has 6 outermost e⁻. Forms 2 bond pairs, leaving <strong>2 lone pairs</strong>.<br>&rarr; Shape: <strong class="text-slate-800">V-shaped / Bent</strong></li>

                                <div class="bg-slate-800 p-4 rounded-lg text-white font-mono flex items-center justify-center space-x-4">
                                    <span class="text-blue-300">H <sup>&delta;+</sup></span>
