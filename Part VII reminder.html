                            <i class="fas fa-equals absolute -right-4 -bottom-4 text-7xl text-white opacity-10 transform rotate-12"></i>
                            <h3 class="font-black text-2xl mb-2 flex items-center text-green-400">
                                <i class="fas fa-balance-scale-right mr-3"></i> Balancing Electrons
                            </h3>
                            <p class="text-slate-200 text-[1.05rem] leading-relaxed">
                                When combining two half-equations into a full redox equation, make sure you multiply the equations so that the <strong>number of electrons (e⁻) cancel out completely</strong>.<br><br>
                                A full redox equation should <strong>NEVER</strong> contain any 'e⁻' in it!
                            </p>
                        </div>
                        
                        <div class="text-center mt-8 text-slate-500 font-bold">
                            Good luck on your HKDSE Chemistry Exam! 🚀
                        </div>
                    </div>
                `
            }
        ];

        // Function to handle tab switching
        function changeTab(index) {
            // Update Tab Styling
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, i) => {
                if(i === index) {
                    tab.classList.add('tab-active');
                    tab.classList.replace('text-slate-600', 'text-indigo-700');
                } else {
                    tab.classList.remove('tab-active');
                    tab.classList.replace('text-indigo-700', 'text-slate-600');
                }
            });

            // Fetch Content
            const data = contentData[index];
            const contentArea = document.getElementById('content-area');
            
            // Generate HTML structure for content
            const contentHTML = `
                <div class="fade-in">
                    <div class="flex items-center space-x-3 mb-4">
                        <i class="fas ${data.icon} text-3xl"></i>
                        <h2 class="text-3xl font-black text-slate-800">${data.title}</h2>
                    </div>
                    <p class="text-lg text-slate-500 font-medium pb-6 border-b border-slate-200">${data.intro}</p>
                    <div class="mt-4">
                        ${data.body}
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = contentHTML;
        }

        // Initialize first tab on load
        document.addEventListener('DOMContentLoaded', () => {
            changeTab(0);
        });
    </script>
</body>
</html>
